<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guiders · limpiar datos del visitante</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    main { max-width: 34rem; padding: 2rem; }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; }
    p { line-height: 1.5; color: #94a3b8; }
    code { background: #1e293b; padding: .1rem .35rem; border-radius: .25rem; }
    ul { color: #94a3b8; line-height: 1.6; }
    .ok { color: #4ade80; font-weight: 600; }
    .origin { color: #e2e8f0; }
  </style>
</head>
<body>
  <main>
    <h1>Guiders · limpiar datos del visitante</h1>
    <p id="status">Limpiando…</p>
    <p>Origen: <span class="origin" id="origin"></span></p>
    <ul id="detail"></ul>
    <p>
      Página de desarrollo: borra el almacenamiento local de este origen
      (huella, <code>visitorId</code>, chat y cola de eventos) para empezar
      una prueba como visitante nuevo. No toca la sesión de Console.
    </p>
  </main>
  <script>
    (function clearGuidersStorage() {
      var detail = [];

      try {
        var localKeys = Object.keys(localStorage);
        localStorage.clear();
        detail.push(localStorage.length === 0
          ? 'localStorage: ' + localKeys.length + ' claves borradas'
          : 'localStorage: no se pudo vaciar');
      } catch (error) {
        detail.push('localStorage: ' + error.message);
      }

      try {
        var sessionKeys = Object.keys(sessionStorage);
        sessionStorage.clear();
        detail.push('sessionStorage: ' + sessionKeys.length + ' claves borradas');
      } catch (error) {
        detail.push('sessionStorage: ' + error.message);
      }

      // Cookies del propio origen. La de sesión del backend es HttpOnly y de
      // otro origen: caduca sola al no existir ya el visitante en la BD.
      var cookies = document.cookie ? document.cookie.split(';') : [];
      cookies.forEach(function (cookie) {
        var name = cookie.split('=')[0].trim();
        document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
      });
      detail.push('cookies del origen: ' + cookies.length + ' caducadas');

      if (window.indexedDB && indexedDB.databases) {
        indexedDB.databases().then(function (dbs) {
          dbs.forEach(function (db) {
            if (db.name) indexedDB.deleteDatabase(db.name);
          });
        }).catch(function () { /* navegador sin soporte: irrelevante aquí */ });
      }

      document.getElementById('origin').textContent = location.origin;
      document.getElementById('status').innerHTML =
        '<span class="ok">Listo.</span> Abre la demo y serás un visitante nuevo.';
      document.getElementById('detail').innerHTML = detail
        .map(function (line) { return '<li>' + line + '</li>'; })
        .join('');
    })();
  </script>
</body>
</html>
